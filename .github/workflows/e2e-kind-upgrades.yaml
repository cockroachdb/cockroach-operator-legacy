name: e2e-kind-upgrades

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  e2e-kind-upgrades:
    runs-on: [self-hosted, ubuntu_2404]
    env:
      NODE_VERSION: "1.35.9"
    steps:
      - uses: actions/checkout@v4
      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: "~/.cache/bazel"
          key: bazel

      - name: Set up matching kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v${{ env.NODE_VERSION }}

      - name: End-to-end (k3d)
        env:
          K3D_IMAGE: rancher/k3s:v${{ env.NODE_VERSION }}-k3s1
          CLUSTER_NAME: upgrade-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.NODE_VERSION }}
        run: make test/e2e/k3d-upgrades
